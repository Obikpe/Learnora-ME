<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330"><rect width="900" height="330" rx="20" fill="#f4f6fb"/><g font-family="Arial" text-anchor="middle" fill="#18213b"><text x="450" y="40" font-size="25">Avoid related records crossing the split</text><text x="225" y="85" font-size="21">Random row split</text><text x="675" y="85" font-size="21">Group / time split</text></g><g stroke="#52617d" stroke-width="2"><rect x="55" y="110" width="340" height="145" rx="12" fill="#fff"/><rect x="505" y="110" width="340" height="145" rx="12" fill="#fff"/></g><g font-family="Arial" font-size="17" text-anchor="middle"><g fill="#dce8fb"><rect x="80" y="135" width="55" height="45"/><rect x="145" y="135" width="55" height="45"/><rect x="210" y="135" width="55" height="45"/><rect x="275" y="135" width="55" height="45"/></g><g fill="#d9efe7"><rect x="80" y="190" width="55" height="45"/><rect x="145" y="190" width="55" height="45"/></g><g fill="#dce8fb"><rect x="535" y="135" width="75" height="100"/><rect x="620" y="135" width="75" height="100"/></g><g fill="#d9efe7"><rect x="710" y="135" width="105" height="100"/></g><g fill="#18213b"><text x="107" y="163">A</text><text x="172" y="163">B</text><text x="237" y="163">A</text><text x="302" y="163">C</text><text x="107" y="218">B</text><text x="172" y="218">C</text><text x="572" y="190">Group A</text><text x="657" y="190">Group B</text><text x="762" y="190">Held out</text></g></g><text x="450" y="295" font-family="Arial" font-size="17" text-anchor="middle" fill="#52617d">Keep the same person/device together, or train on earlier time periods and test later ones.</text></svg>