<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 270"><rect width="950" height="270" rx="20" fill="#f4f6fb"/><text x="475" y="42" font-family="Arial" font-size="25" text-anchor="middle" fill="#18213b">A leakage-safe preprocessing pipeline</text><g font-family="Arial" text-anchor="middle" fill="#18213b" font-size="18" stroke="#52617d" stroke-width="2"><rect x="35" y="90" width="150" height="85" rx="12" fill="#fff"/><rect x="220" y="90" width="150" height="85" rx="12" fill="#dce8fb"/><rect x="405" y="90" width="150" height="85" rx="12" fill="#dce8fb"/><rect x="590" y="90" width="150" height="85" rx="12" fill="#e8e2fb"/><rect x="775" y="90" width="140" height="85" rx="12" fill="#d9efe7"/></g><g font-family="Arial" font-size="18" text-anchor="middle" fill="#18213b"><text x="110" y="140">Raw data</text><text x="295" y="125">Impute</text><text x="295" y="150">missing values</text><text x="480" y="125">Encode /</text><text x="480" y="150">scale</text><text x="665" y="140">Estimator</text><text x="845" y="140">Prediction</text></g><g stroke="#52617d" stroke-width="3"><path d="M185 132h35M370 132h35M555 132h35M740 132h35"/></g><text x="475" y="220" font-family="Arial" font-size="17" text-anchor="middle" fill="#52617d">Fit each transformation on training data; reuse it for held-out data.</text></svg>