<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><rect width="900" height="330" rx="20" fill="#f7f8fc"/><g font-family="Arial"><text x="60" y="55" font-size="24" font-weight="bold" fill="#252b55">Same residuals, different summaries</text><g fill="#5965a8"><rect x="100" y="110" width="90" height="45" rx="8"/><rect x="220" y="110" width="90" height="45" rx="8"/><rect x="340" y="110" width="90" height="45" rx="8"/><rect x="460" y="110" width="90" height="45" rx="8"/><rect x="580" y="110" width="90" height="45" rx="8"/></g><g fill="white" font-size="18" text-anchor="middle"><text x="145" y="139">+10</text><text x="265" y="139">-2</text><text x="385" y="139">-5</text><text x="505" y="139">+10</text><text x="625" y="139">-30</text></g><g fill="#252b55" font-size="20"><text x="100" y="210">MAE: average absolute miss</text><text x="100" y="245">RMSE: gives large misses extra weight</text><text x="100" y="280">R²: compares with a mean-prediction baseline</text></g></g></svg>