<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330"><rect width="900" height="330" rx="20" fill="#f7f8fc"/><g font-family="Arial"><text x="60" y="50" font-size="24" font-weight="bold" fill="#252b55">Threshold changes the decision balance</text><path d="M100 250H800M100 250V90" stroke="#6973aa" stroke-width="2"/><path d="M120 225C300 190 470 135 770 100" fill="none" stroke="#37845a" stroke-width="5"/><path d="M120 100C330 130 540 190 770 225" fill="none" stroke="#c65d55" stroke-width="5"/><g fill="#252b55" font-size="17"><text x="120" y="280">Low threshold</text><text x="770" y="280" text-anchor="end">High threshold</text><text x="700" y="90" fill="#245c3c">Precision tends to rise</text><text x="115" y="82" fill="#8a3430">Recall tends to fall</text></g><text x="450" y="315" text-anchor="middle" font-size="15" fill="#555d83">Illustrative relationship; actual curves depend on the model and data.</text></g></svg>