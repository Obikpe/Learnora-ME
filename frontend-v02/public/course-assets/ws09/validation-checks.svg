<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Cluster validation checklist</title><desc id="desc">Four connected checks: geometry metrics, stability, interpretable profiles, and usefulness and risk.</desc><rect width="1000" height="390" rx="24" fill="#f8fafc"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">Validate more than one score</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="115" width="195" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="290" y="115" width="195" height="150" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><rect x="525" y="115" width="195" height="150" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><rect x="760" y="115" width="195" height="150" rx="18" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><g font-size="20" font-weight="700" fill="#18213b"><text x="152" y="155">Geometry</text><text x="387" y="155">Stability</text><text x="622" y="155">Profiles</text><text x="857" y="155">Use &amp; risk</text></g><g font-size="15" fill="#334155"><text x="152" y="190">Silhouette</text><text x="152" y="215">Compactness</text><text x="387" y="190">Seeds</text><text x="387" y="215">Samples</text><text x="622" y="190">Original units</text><text x="622" y="215">Group sizes</text><text x="857" y="190">Decision value</text><text x="857" y="215">Fairness &amp; privacy</text></g><g stroke="#64748b" stroke-width="3" fill="none"><path d="M250 190h38m-10 -8 10 8-10 8"/><path d="M485 190h38m-10 -8 10 8-10 8"/><path d="M720 190h38m-10 -8 10 8-10 8"/></g><text x="500" y="325" font-size="18" fill="#475569">A strong clustering result must be stable, interpretable and useful — not just numerically tidy.</text></g></svg>