<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Feature preparation decisions</title><desc id="desc">Raw data is inspected, identifiers and irrelevant fields are excluded, missing values are handled, categories encoded, numeric features scaled, and original units retained for interpretation.</desc><rect width="1000" height="420" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">Preparing features changes what “similar” means</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="110" width="180" height="210" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="125" y="145" font-size="20" font-weight="700" fill="#18213b">Raw table</text><g font-size="15" fill="#334155"><text x="125" y="185">Customer ID</text><text x="125" y="215">Spend (₦)</text><text x="125" y="245">Orders</text><text x="125" y="275">Region</text></g><path d="M215 215h45m-10 -9 10 9-10 9" stroke="#64748b" stroke-width="3" fill="none"/><rect x="265" y="110" width="190" height="210" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="360" y="145" font-size="20" font-weight="700" fill="#9f1239">Review</text><g font-size="15" fill="#881337"><text x="360" y="190">Exclude IDs</text><text x="360" y="225">Check missingness</text><text x="360" y="260">Check units & ranges</text><text x="360" y="295">Remove leakage</text></g><path d="M455 215h45m-10 -9 10 9-10 9" stroke="#64748b" stroke-width="3" fill="none"/><rect x="505" y="110" width="205" height="210" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="607" y="145" font-size="20" font-weight="700" fill="#1e3a8a">Transform</text><g font-size="15" fill="#1e40af"><text x="607" y="190">Impute carefully</text><text x="607" y="225">Encode categories</text><text x="607" y="260">Scale numeric fields</text><text x="607" y="295">Save fitted pipeline</text></g><path d="M710 215h45m-10 -9 10 9-10 9" stroke="#64748b" stroke-width="3" fill="none"/><rect x="760" y="110" width="205" height="210" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="862" y="145" font-size="20" font-weight="700" fill="#065f46">Use & explain</text><g font-size="15" fill="#065f46"><text x="862" y="190">Fit model on matrix</text><text x="862" y="225">Keep original values</text><text x="862" y="260">Profile in real units</text><text x="862" y="295">Document decisions</text></g><text x="500" y="375" font-size="18" fill="#475569">Do not let arbitrary identifiers or incompatible units define similarity.</text></g></svg>