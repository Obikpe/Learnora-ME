<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Distance and similarity measures</title><desc id="desc">Comparison of Euclidean straight-line distance, Manhattan grid distance, cosine direction similarity, and Jaccard set overlap.</desc><rect width="1000" height="400" rx="24" fill="#f8fafc"/><text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">Different measures define similarity differently</text><g font-family="Arial"><g transform="translate(45 90)"><rect width="210" height="240" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="105" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1e3a8a">Euclidean</text><path d="M35 180L170 75" stroke="#2563eb" stroke-width="5"/><circle cx="35" cy="180" r="7" fill="#1e40af"/><circle cx="170" cy="75" r="7" fill="#1e40af"/><text x="105" y="215" text-anchor="middle" font-size="14" fill="#334155">Straight-line length</text></g><g transform="translate(285 90)"><rect width="210" height="240" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="105" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">Manhattan</text><path d="M35 180V75H170" stroke="#16a34a" stroke-width="5" fill="none"/><circle cx="35" cy="180" r="7" fill="#166534"/><circle cx="170" cy="75" r="7" fill="#166534"/><text x="105" y="215" text-anchor="middle" font-size="14" fill="#334155">Grid-path distance</text></g><g transform="translate(525 90)"><rect width="210" height="240" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="105" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">Cosine</text><path d="M35 180L160 95M35 180L170 60" stroke="#ea580c" stroke-width="4" fill="none"/><path d="M75 180A40 40 0 0 0 70 154" stroke="#9a3412" stroke-width="2" fill="none"/><circle cx="35" cy="180" r="7" fill="#9a3412"/><text x="105" y="215" text-anchor="middle" font-size="14" fill="#334155">Angle / direction</text></g><g transform="translate(765 90)"><rect width="190" height="240" rx="16" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/><text x="95" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#9d174d">Jaccard</text><circle cx="78" cy="115" r="43" fill="#f9a8d4" fill-opacity=".8" stroke="#be185d" stroke-width="2"/><circle cx="112" cy="115" r="43" fill="#c4b5fd" fill-opacity=".8" stroke="#6d28d9" stroke-width="2"/><text x="95" y="215" text-anchor="middle" font-size="14" fill="#334155">Set overlap / union</text></g><text x="500" y="370" text-anchor="middle" font-size="17" fill="#475569">Choose the formula that matches the meaning and type of your features.</text></g></svg>