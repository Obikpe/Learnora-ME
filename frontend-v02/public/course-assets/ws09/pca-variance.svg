<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">PCA explained variance</title><desc id="desc">Bars show variance explained by each principal component and a rising cumulative variance line.</desc><rect width="1000" height="390" rx="24" fill="#f8fafc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">Explained variance and cumulative variance</text><g stroke="#cbd5e1" stroke-width="1"><path d="M110 300H900M110 240H900M110 180H900M110 120H900"/></g><g fill="#93c5fd"><rect x="180" y="100" width="75" height="200"/><rect x="315" y="190" width="75" height="110"/><rect x="450" y="235" width="75" height="65"/><rect x="585" y="270" width="75" height="30"/><rect x="720" y="285" width="75" height="15"/></g><path d="M217 100L352 210L487 275L622 305L757 320" fill="none" stroke="#ea580c" stroke-width="4"/><g fill="#ea580c"><circle cx="217" cy="100" r="7"/><circle cx="352" cy="210" r="7"/><circle cx="487" cy="275" r="7"/><circle cx="622" cy="305" r="7"/><circle cx="757" cy="320" r="7"/></g><g font-family="Arial" font-size="16" fill="#334155" text-anchor="middle"><text x="217" y="330">PC1</text><text x="352" y="330">PC2</text><text x="487" y="330">PC3</text><text x="622" y="330">PC4</text><text x="757" y="330">PC5</text><text x="500" y="365">Bars: individual variance • Line: cumulative variance (illustrative)</text></g><g font-family="Arial" font-size="15" fill="#1e3a8a"><text x="830" y="95">Bars</text><text x="830" y="118" fill="#c2410c">Cumulative line</text></g></svg>