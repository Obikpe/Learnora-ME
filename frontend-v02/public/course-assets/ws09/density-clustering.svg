<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">DBSCAN density clustering</title><desc id="desc">Two dense point clouds are shown as separate clusters, with isolated points shown as noise. A neighbourhood circle illustrates epsilon around a core point.</desc><rect width="1000" height="390" rx="24" fill="#f8fafc"/><text x="500" y="44" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">DBSCAN: dense regions become clusters</text><g stroke-width="2"><ellipse cx="260" cy="200" rx="155" ry="100" fill="#dbeafe" stroke="#2563eb" stroke-dasharray="7 6"/><ellipse cx="680" cy="190" rx="150" ry="100" fill="#dcfce7" stroke="#16a34a" stroke-dasharray="7 6"/></g><g fill="#2563eb"><circle cx="180" cy="160" r="8"/><circle cx="220" cy="190" r="8"/><circle cx="260" cy="145" r="8"/><circle cx="300" cy="200" r="8"/><circle cx="340" cy="165" r="8"/><circle cx="245" cy="230" r="8"/><circle cx="190" cy="245" r="8"/><circle cx="285" cy="260" r="8"/></g><g fill="#16a34a"><circle cx="600" cy="150" r="8"/><circle cx="640" cy="190" r="8"/><circle cx="680" cy="145" r="8"/><circle cx="720" cy="210" r="8"/><circle cx="760" cy="170" r="8"/><circle cx="665" cy="235" r="8"/><circle cx="610" cy="240" r="8"/><circle cx="735" cy="255" r="8"/></g><g fill="#dc2626"><circle cx="465" cy="90" r="8"/><circle cx="500" cy="300" r="8"/><circle cx="875" cy="110" r="8"/><circle cx="900" cy="285" r="8"/></g><circle cx="260" cy="145" r="48" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 5"/><g font-family="Arial" font-size="16" fill="#334155"><text x="260" y="340" text-anchor="middle">Cluster A</text><text x="680" y="340" text-anchor="middle">Cluster B</text><text x="850" y="355" text-anchor="middle" fill="#b91c1c">Noise points</text><text x="315" y="100" fill="#1e40af">ε neighbourhood</text></g></svg>