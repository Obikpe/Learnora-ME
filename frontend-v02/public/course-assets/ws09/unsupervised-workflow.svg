<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc"><title id="title">Unsupervised learning workflow</title><desc id="desc">A sequence from question and observation unit through features, preprocessing, algorithm, validation and interpretation.</desc><rect width="1000" height="360" rx="24" fill="#f7f8fc"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">A defensible unsupervised-learning workflow</text><g font-family="Arial" text-anchor="middle"><g fill="#e7efff" stroke="#4776c7" stroke-width="2"><rect x="25" y="115" width="135" height="105" rx="14"/><rect x="190" y="115" width="135" height="105" rx="14"/><rect x="355" y="115" width="135" height="105" rx="14"/><rect x="520" y="115" width="135" height="105" rx="14"/><rect x="685" y="115" width="135" height="105" rx="14"/><rect x="850" y="115" width="125" height="105" rx="14"/></g><g font-size="17" font-weight="700" fill="#18213b"><text x="92" y="155">Question</text><text x="92" y="180">and unit</text><text x="257" y="155">Select</text><text x="257" y="180">features</text><text x="422" y="155">Prepare</text><text x="422" y="180">data</text><text x="587" y="155">Fit</text><text x="587" y="180">method</text><text x="752" y="155">Validate</text><text x="752" y="180">structure</text><text x="912" y="155">Interpret</text><text x="912" y="180">carefully</text></g><g stroke="#53627f" stroke-width="3" fill="none"><path d="M160 168h28m-8 -8 8 8-8 8"/><path d="M325 168h28m-8 -8 8 8-8 8"/><path d="M490 168h28m-8 -8 8 8-8 8"/><path d="M655 168h28m-8 -8 8 8-8 8"/><path d="M820 168h28m-8 -8 8 8-8 8"/></g><text x="500" y="285" font-size="18" fill="#475569">A model output is a hypothesis about structure — not automatically a real-world truth.</text></g></svg>