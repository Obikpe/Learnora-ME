<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Cluster profiling example</title><desc id="desc">A profile table compares group sizes, recency, order frequency and basket value, followed by a neutral segment description and testable action.</desc><rect width="1000" height="390" rx="24" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#18213b">From cluster labels to evidence-based profiles</text><g font-family="Arial"><rect x="75" y="85" width="850" height="190" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="75" y="85" width="850" height="45" rx="12" fill="#e2e8f0"/><g font-size="17" font-weight="700" fill="#1e293b"><text x="120" y="114">Group</text><text x="320" y="114">Size</text><text x="485" y="114">Median recency</text><text x="665" y="114">Orders</text><text x="825" y="114">Basket</text></g><g stroke="#cbd5e1"><path d="M75 130h850M75 178h850M75 226h850"/></g><g font-size="17" fill="#334155"><text x="120" y="160">A</text><text x="320" y="160">62%</text><text x="485" y="160">8 days</text><text x="665" y="160">10</text><text x="825" y="160">₦420</text><text x="120" y="208">B</text><text x="320" y="208">38%</text><text x="485" y="208">75 days</text><text x="665" y="208">1</text><text x="825" y="208">₦70</text></g><text x="500" y="315" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Describe what was measured — do not invent identity or future behaviour.</text><text x="500" y="350" text-anchor="middle" font-size="16" fill="#475569">Profile → cautious interpretation → low-risk test → evaluate independently</text></g></svg>