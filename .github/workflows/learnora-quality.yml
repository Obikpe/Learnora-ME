name: Learnora production checks

on:
  push:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

# One in-flight validation for main: newer commits supersede stale queued builds.
concurrency:
  group: learnora-production-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-checks:
    name: Production regression and frontend builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learnora_release_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: learnora-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnora_release_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:learnora-ci-only@localhost:5432/learnora_release_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend-python/requirements.txt

      - name: Compile backend
        working-directory: backend-python
        run: python -m compileall -q .

      - name: Rehearse additive learner-outcome migrations and rollbacks
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/baselines/active-pheonix-public-schema.sql
          for migration in \
            supabase/migrations/20261102090000_learner_learning_plans.sql \
            supabase/migrations/20261102100000_quiz_active_sessions.sql \
            supabase/migrations/20261102110000_certificate_revocation.sql \
            supabase/migrations/20261102120000_project_submission_integrity.sql
          do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/learner_learning_plans_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/quiz_active_sessions_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT revoked_at, revoked_by, revocation_reason FROM public.certificates LIMIT 0"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/project_submission_integrity_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \\i supabase/rollback/20261102090000_learner_learning_plans.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.learner_learning_plans') IS NOT NULL THEN
              RAISE EXCEPTION 'learner plan rollback did not remove its table';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \\i supabase/rollback/20261102100000_quiz_active_sessions.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.quiz_active_sessions') IS NOT NULL THEN
              RAISE EXCEPTION 'quiz session rollback did not remove its table';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \\i supabase/rollback/20261102110000_certificate_revocation.rollback.sql
          DO $do$ BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='certificates'
                AND column_name IN ('revoked_at','revoked_by','revocation_reason')
            ) THEN
              RAISE EXCEPTION 'certificate revocation rollback did not remove all columns';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \\i supabase/rollback/20261102120000_project_submission_integrity.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.project_submissions_one_active_per_learner_idx') IS NOT NULL
              OR to_regclass('public.skill_evidence_project_submission_skill_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'project integrity rollback did not remove both indexes';
            END IF;
          END $do$;
          ROLLBACK;
          SQL

      - name: Install compatible test client and static checker
        run: python -m pip install "httpx<0.28" ruff

      - name: Check Python undefined names and syntax
        working-directory: backend-python
        run: ruff check . --select E9,F821,F811

      - name: Import backend application
        working-directory: backend-python
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: python -c "import main; print('Learnora application import passed')"

      - name: Run focused production regressions
        working-directory: backend-python
        run: |
          set -e
          for test_file in \
            test_quiz_session_lifecycle.py \
            test_project_submission_integrity.py \
            test_learning_outcomes.py \
            test_certificate_verification.py \
            test_free_access_mode.py \
            test_frontend_security_contracts.py \
            test_migration_inventory.py \
            test_supabase_migration_inventory.py \
            test_quiz_tutor_lock.py
          do
            python -m unittest discover -s tests -p "$test_file"
          done

      - name: Smoke-test backend HTTP startup
        working-directory: backend-python
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/learnora-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Backend health endpoint did not become ready")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84bd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend-v02/package.json
            frontend-team/package.json

      - name: Build learner website
        working-directory: frontend-v02
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build Teams website
        working-directory: frontend-team
        run: |
          npm install --no-audit --no-fund
          npm run build
