name: Learnora production checks

on:
  push:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - ".github/workflows/**"

permissions:
  contents: read

# Keep validations queued so a newer main commit cannot cancel an in-flight required check.
concurrency:
  group: learnora-production-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-checks:
    name: Production regression and frontend builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learnora_release_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: learnora-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d learnora_release_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:learnora-ci-only@localhost:5432/learnora_release_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend-python/requirements.txt

      - name: Audit backend dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r backend-python/requirements.txt --strict

      - name: Compile backend
        working-directory: backend-python
        run: python -m compileall -q .

      - name: Rehearse additive learner-outcome migrations and rollbacks
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/baselines/active-pheonix-public-schema.sql
          # The plain Postgres rehearsal does not include Supabase Storage's managed schema.
          # Provide the minimal bucket catalog required by the private-resource-bucket migration.
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.buckets (
            id text PRIMARY KEY,
            name text NOT NULL,
            public boolean NOT NULL DEFAULT false,
            file_size_limit bigint,
            allowed_mime_types text[]
          );
          SQL
          for migration in \
            supabase/migrations/20261103041002_add_lesson_video_transcript_text.sql \
            supabase/migrations/20261109160440_learner_account_deletion_lifecycle.sql \
            supabase/migrations/20261116072916_notification_email_automation.sql \
            supabase/migrations/20261118090829_learner_learning_plans.sql \
            supabase/migrations/20261118090830_quiz_active_sessions.sql \
            supabase/migrations/20261118090832_certificate_revocation.sql \
            supabase/migrations/20261118090839_project_submission_integrity.sql \
            supabase/migrations/20261118090841_password_session_invalidation.sql \
            supabase/migrations/20261118090842_private_course_resources_bucket.sql \
            supabase/migrations/20261118091000_feature_foreign_key_indexes.sql \
            supabase/migrations/20261118214152_public_course_catalogue_rpc.sql \
            supabase/migrations/20261119224623_course_completion_skill_badges.sql \
            supabase/migrations/20261120133258_learner_birthdays_and_age_attestation.sql \
            supabase/migrations/20261120133439_clear_birthday_data_on_account_deletion.sql \
            supabase/migrations/20261121150000_ai_course_production_drafts.sql
          do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/learner_learning_plans_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/quiz_active_sessions_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT revoked_at, revoked_by, revocation_reason FROM public.certificates LIMIT 0"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/project_submission_integrity_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/notification_automation_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/migration_reconciliation_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/public_course_catalogue_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend-python/tests/db/course_production_schema_assertions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT password_changed_at FROM public.users LIMIT 0"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT password_changed_at FROM public.admins LIMIT 0"
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261116120000_notification_email_automation.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.learner_notification_deliveries') IS NOT NULL THEN
              RAISE EXCEPTION 'notification delivery rollback did not remove its table';
            END IF;
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='users'
                AND column_name='last_inactivity_email_at'
            ) OR EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='learner_onboarding_profiles'
                AND column_name='onboarding_completed_at'
            ) THEN
              RAISE EXCEPTION 'notification delivery rollback did not remove its timestamp columns';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261102090000_learner_learning_plans.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.learner_learning_plans') IS NOT NULL THEN
              RAISE EXCEPTION 'learner plan rollback did not remove its table';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261102100000_quiz_active_sessions.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.quiz_active_sessions') IS NOT NULL THEN
              RAISE EXCEPTION 'quiz session rollback did not remove its table';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261102110000_certificate_revocation.rollback.sql
          DO $do$ BEGIN
            IF EXISTS (
              SELECT 1 FROM information_schema.columns
              WHERE table_schema='public' AND table_name='certificates'
                AND column_name IN ('revoked_at','revoked_by','revocation_reason')
            ) THEN
              RAISE EXCEPTION 'certificate revocation rollback did not remove all columns';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261102120000_project_submission_integrity.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.project_submissions_one_active_per_learner_idx') IS NOT NULL
              OR to_regclass('public.skill_evidence_project_submission_skill_unique_idx') IS NOT NULL THEN
              RAISE EXCEPTION 'project integrity rollback did not remove both indexes';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261119224623_course_completion_skill_badges.rollback.sql
          DO $do$ BEGIN
            IF EXISTS (
              SELECT 1 FROM public.skills WHERE name = 'Data Analytics Foundations'
            ) OR EXISTS (
              SELECT 1 FROM public.badges
              WHERE criteria->>'course_id' = 'e89cdf59-f4ad-4453-ab14-73e372fbce7e'
            ) THEN
              RAISE EXCEPTION 'course-completion badge rollback did not remove the seeded skill and badge';
            END IF;
          END $do$;
          ROLLBACK;
          SQL
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          \i supabase/rollback/20261121150000_ai_course_production_drafts.rollback.sql
          DO $do$ BEGIN
            IF to_regclass('public.learnora_course_generation_jobs') IS NOT NULL
              OR to_regclass('public.learnora_lesson_production_packages') IS NOT NULL
              OR to_regprocedure('public.create_course_from_generation_job(uuid)') IS NOT NULL
              OR EXISTS (SELECT 1 FROM public.learnora_permissions WHERE permission_key='content.generate') THEN
              RAISE EXCEPTION 'AI course production rollback did not remove its schema and permission';
            END IF;
          END $do$;
          ROLLBACK;
          SQL

      - name: Install compatible test client and static checker
        run: python -m pip install "httpx<0.28" ruff

      - name: Check Python undefined names and syntax
        working-directory: backend-python
        run: ruff check . --select E9,F821,F811

      - name: Import backend application
        working-directory: backend-python
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: python -c "import main; print('Learnora application import passed')"

      - name: Run the complete backend test suite
        working-directory: backend-python
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke-test backend HTTP startup
        working-directory: backend-python
        env:
          APP_ENV: development
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSJ9.test-signature
          JWT_SECRET: learnora-ci-only-secret-32-characters-minimum
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/learnora-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Backend health endpoint did not become ready")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Build learner website
        working-directory: frontend-v02
        env:
          NODE_OPTIONS: --trace-deprecation
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/learnora-v02-npm-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP + "/learnora-v02-npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Learner frontend npm audit:", JSON.stringify(v));'
          echo "::group::Deprecated dependency paths"
          npm ls inflight rimraf glob @humanwhocodes/config-array @humanwhocodes/object-schema eslint --all || true
          echo "::endgroup::"
          BASE_SHA="$(jq -r 'if .pull_request then .pull_request.base.sha else .before end' "$GITHUB_EVENT_PATH")"
          git cat-file -e "$BASE_SHA^{commit}"
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- 'frontend-v02/*.js' 'frontend-v02/*.jsx' 'frontend-v02/*.ts' 'frontend-v02/*.tsx' | sed 's#^frontend-v02/##')"
          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES" | xargs -r npx eslint
          else
            echo "No learner frontend source files changed; full build still runs."
          fi
          npm run build

      - name: Build Teams website
        working-directory: frontend-team
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm audit --json > "$RUNNER_TEMP/learnora-team-npm-audit.json" || true
          node -e 'const a=require(process.env.RUNNER_TEMP + "/learnora-team-npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Teams frontend npm audit:", JSON.stringify(v));'
          BASE_SHA="$(jq -r 'if .pull_request then .pull_request.base.sha else .before end' "$GITHUB_EVENT_PATH")"
          git cat-file -e "$BASE_SHA^{commit}"
          CHANGED_FILES="$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- 'frontend-team/*.js' 'frontend-team/*.jsx' 'frontend-team/*.ts' 'frontend-team/*.tsx' | sed 's#^frontend-team/##')"
          if [ -n "$CHANGED_FILES" ]; then
            printf '%s\n' "$CHANGED_FILES" | xargs -r npx eslint
          else
            echo "No Teams frontend source files changed; full build still runs."
          fi
          npm run build

      - name: Upload generated dependency lockfiles for review
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: learnora-generated-lockfiles
          path: |
            frontend-v02/package-lock.json
            frontend-team/package-lock.json
          if-no-files-found: warn
          retention-days: 1

  commit-generated-lockfiles:
    name: Commit verified npm lockfiles
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: production-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true

      - name: Download verified lockfiles
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: learnora-generated-lockfiles
          path: ./

      - name: Commit lockfiles when they change
        run: |
          git add frontend-v02/package-lock.json frontend-team/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified frontend dependency lockfiles"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
