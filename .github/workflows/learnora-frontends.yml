name: Learnora frontends
on:
  push:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend-python/**"
      - "frontend/**"
      - "frontend-v02/**"
      - "frontend-team/**"
      - "supabase/**"
      - "package.json"
      - ".github/workflows/**"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, frontend-v02, frontend-team]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://learnora-backend.vercel.app
