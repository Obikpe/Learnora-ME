<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320"><rect width="900" height="320" rx="20" fill="#f4f6fb"/><text x="450" y="42" font-family="Arial" font-size="25" text-anchor="middle" fill="#18213b">Responsible ML is a continuous review cycle</text><g stroke="#52617d" stroke-width="2"><rect x="40" y="105" width="175" height="95" rx="13" fill="#fff"/><rect x="250" y="105" width="175" height="95" rx="13" fill="#dce8fb"/><rect x="460" y="105" width="175" height="95" rx="13" fill="#e8e2fb"/><rect x="670" y="105" width="190" height="95" rx="13" fill="#d9efe7"/></g><g font-family="Arial" text-anchor="middle" fill="#18213b"><text x="127" y="145" font-size="20">Frame</text><text x="127" y="170" font-size="17">purpose + harms</text><text x="337" y="145" font-size="20">Audit data</text><text x="337" y="170" font-size="17">privacy + bias</text><text x="547" y="145" font-size="20">Evaluate</text><text x="547" y="170" font-size="17">errors + groups</text><text x="765" y="145" font-size="20">Monitor</text><text x="765" y="170" font-size="17">appeals + change</text></g><g stroke="#52617d" stroke-width="3"><path d="M215 152h35M425 152h35M635 152h35"/></g><text x="450" y="250" font-family="Arial" font-size="18" text-anchor="middle" fill="#52617d">Accountability, human oversight and documentation run through every stage.</text></svg>