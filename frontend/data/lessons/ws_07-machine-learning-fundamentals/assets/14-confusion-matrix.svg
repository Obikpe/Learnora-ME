<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390"><rect width="800" height="390" rx="20" fill="#f4f6fb"/><text x="400" y="42" font-family="Arial" font-size="25" text-anchor="middle" fill="#18213b">Binary classification confusion matrix</text><text x="400" y="82" font-family="Arial" font-size="18" text-anchor="middle" fill="#18213b">Predicted class</text><text x="235" y="115" font-family="Arial" font-size="18" text-anchor="middle" fill="#18213b">Negative</text><text x="475" y="115" font-family="Arial" font-size="18" text-anchor="middle" fill="#18213b">Positive</text><text x="70" y="220" font-family="Arial" font-size="18" fill="#18213b" transform="rotate(-90 70 220)">Actual class</text><g stroke="#52617d" stroke-width="2"><rect x="125" y="135" width="220" height="100" fill="#dce8fb"/><rect x="345" y="135" width="220" height="100" fill="#f6dfd9"/><rect x="125" y="235" width="220" height="100" fill="#f6dfd9"/><rect x="345" y="235" width="220" height="100" fill="#d9efe7"/></g><g font-family="Arial" text-anchor="middle" fill="#18213b"><text x="235" y="178" font-size="22" font-weight="bold">True negative</text><text x="235" y="205" font-size="17">Correct rejection</text><text x="455" y="178" font-size="22" font-weight="bold">False positive</text><text x="455" y="205" font-size="17">False alarm</text><text x="235" y="278" font-size="22" font-weight="bold">False negative</text><text x="235" y="305" font-size="17">Missed positive</text><text x="455" y="278" font-size="22" font-weight="bold">True positive</text><text x="455" y="305" font-size="17">Correct detection</text></g></svg>